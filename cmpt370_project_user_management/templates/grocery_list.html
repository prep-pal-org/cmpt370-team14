<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery List</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styleDesign.css') }}">
    <style>
        .grocery-items li {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-form {
            display: inline;
        }
    </style>
</head>
<body>
    {% include 'partial/topnav.html' %}

    <div class="center-column">
        <h1>My Grocery List</h1>

        <form action="{{ url_for('add_grocery_item') }}" method="POST">
            <label for="item_text">New Item:</label>
            <input type="text" id="item_text" name="item_text" required>

            <label for="quantity">Quantity:</label>
            <input type="text" id="quantity" name="quantity" style="width: 50px;">

            <button type="submit">Add Item</button>
        </form>

        <div class="grocery-items">
            <h2>Items:</h2>
            <ul>
                {% for item in items %}
                    <li>
                        <span>
                            {% if item.quantity %}
                                {{ item.quantity }} -
                            {% endif %}
                            {{ item.item_text }}
                        </span>

                        <form action="{{ url_for('remove_grocery_item') }}" method="POST" class="remove-form">
                            <input type="hidden" name="item_id" value="{{ item.id }}">
                            <button type="submit">Remove</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        </div>

        <a href="{{ url_for('home') }}" style="margin-top: 20px;">
            <button>Back to Home</button>
        </a>
    </div>

    <!-- Handle Flash Messages. -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div id="popup" class="popup">
                <div class="popup-content">
                    <p>{{ messages[0] }}</p>
                    <button onclick="closePopup()">Close</button>
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='eventHandling.js') }}"></script>

</body>
</html>
