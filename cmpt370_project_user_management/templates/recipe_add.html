
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Recipe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">
</head>

<body>

    {% include 'partial/topnav.html' %}

    <div class="recipe-background">
        <div class="recipe-box">

            <h1 class="fw-bold">Add Recipe</h1>

            <form method="POST" enctype="multipart/form-data">

                <label>Name:</label>
                <input class="recipe-input" type="text" name="name" required>

                <label>Ingredients:</label>
                <textarea class="recipe-textarea" name="ingredients" required></textarea>

                <label>Instructions:</label>
                <textarea class="recipe-textarea" name="instructions" required></textarea>

                <!-- NEW DIETARY / ALLERGY TAGS -->
                <label>Dietary / Allergy Tags:</label><br>
                <input type="checkbox" name="diet[]" value="Gluten Free"> Gluten Free<br>
                <input type="checkbox" name="diet[]" value="Lactose Free"> Lactose Free<br>
                <input type="checkbox" name="diet[]" value="Peanut Allergy"> Peanut Allergy<br>

                <br>

                <label>Upload Image(s):</label>

                <div style="display:flex; gap:10px; align-items:center;">
                    <button type="button" id="open-file-picker" class="small-btn">Select Image(s)</button>

                    <div id="drop-zone" class="image-drop-zone" style="flex-grow:1;">
                        <p>Drag & drop recipe images here</p>
                    </div>
                </div>

                <input id="recipe-images" type="file" name="recipe_images" accept="image/*" multiple style="display:none;">

                <br><br>
                <button type="submit">Add Recipe</button>
            </form>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('recipe-images');
        const openButton = document.getElementById('open-file-picker');

        if (openButton) openButton.addEventListener('click', () => fileInput.click());

        if (dropZone && fileInput) {
            dropZone.addEventListener('click', () => fileInput.click());

            ['dragenter','dragover'].forEach(evt => {
                dropZone.addEventListener(evt, e => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
            });

            ['dragleave','drop'].forEach(evt => {
                dropZone.addEventListener(evt, e => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                });
            });

            dropZone.addEventListener('drop', e => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    dropZone.querySelector('p').textContent = files.length + " file(s) selected";
                }
            });
        }
    </script>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div id="popup" class="popup">
                <div class="popup-content">
                    <p>{{ messages[0] }}</p>
                    <button onclick="closePopup()">Close</button>
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='eventHandling.js') }}"></script>

</body>
</html>
