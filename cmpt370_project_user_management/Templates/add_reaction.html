<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Reaction</title>
</head>
<body>
    <h1>Add a Reaction</h1>

    <form action="{{ url_for('create_reaction', recipe_id=recipe_id) }}" method="POST">
        <label for="reaction">Your Reaction:</label><br>
        <input type="text" name="reaction" id="reaction" required>
        <br><br>

        <button type="submit">Submit Reaction</button>
    </form>

    <br>
    <a href="{{ url_for('view_recipe', recipe_id=recipe_id) }}">Back to Recipe</a>
</body>
</html>
