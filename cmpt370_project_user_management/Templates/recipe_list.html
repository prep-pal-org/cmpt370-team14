<!-- Recipe List Page - Baraa -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe List</title>

    <!-- Your styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">

    <!-- Bootstrap (CSS framework written in CSS + JS) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body>

<!-- nav -->
<div class="topnav">
    <a href="/logout">Logout</a>
    <a href="/login_landing_page">Home</a>
    <a href="{{ url_for('grocery_list') }}">Grocery List</a>
    <a href="/recipes">All Recipes</a>
    <a href="/my_recipes">My Recipes</a>
    <a href="/favorite_recipes">Favorite Recipes</a>
</div>

<div class="recipe-background">

    <div class="container" style="padding-top: 120px; padding-bottom:40px;">

        <h1 class="text-center mb-4">🍲 Recipe List</h1>

        <!-- Search + Add -->
        <form class="row g-2 mb-4" action="{{ url_for('recipe_list') }}" method="GET">
            <div class="col-md-5">
                <input type="text" name="search_query" class="form-control"
                       placeholder="Search by name or ingredient..."
                       value="{{ search_query }}">
            </div>

            <div class="col-md-2">
                <select name="sort" class="form-select">
                    <option value="newest" {% if current_sort == 'newest' %}selected{% endif %}>Newest</option>
                    <option value="az" {% if current_sort == 'az' %}selected{% endif %}>A - Z</option>
                    <option value="za" {% if current_sort == 'za' %}selected{% endif %}>Z - A</option>
                </select>
            </div>

            <div class="col-md-3">
                <select name="diet" class="form-select">
                    <option value="">All Diets</option>
                    <option value="gluten_free" {% if current_diet == 'gluten_free' %}selected{% endif %}>Gluten Free</option>
                    <option value="lactose_free" {% if current_diet == 'lactose_free' %}selected{% endif %}>Lactose Free</option>
                </select>
            </div>

            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Filter</button>
            </div>
        </form>

        {% if recipes %}
            <!-- Card grid -->
            <div class="row g-4">
                {% for r in recipes %}
                    <div class="col-sm-6 col-md-4 col-lg-3">
                        <div class="card h-100">

                            {% if r.image_path %}
                                <img src="{{ url_for('static', filename=r.image_path) }}"
                                     class="card-img-top"
                                     alt="Recipe image">
                            {% endif %}

                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">{{ r.name }}</h5>
                                <p class="card-text small text-muted">
                                    {{ r.ingredients | truncate(80, True, '...') }}
                                </p>

                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <a href="{{ url_for('edit_recipe', recipe_id=r.recipe_id) }}"
                                       class="btn btn-sm btn-primary">
                                        Edit
                                    </a>

                                    <form action="{{ url_for('delete_recipe', recipe_id=r.recipe_id) }}"
                                          method="POST" style="margin:0;">
                                        <button type="submit" class="btn btn-sm btn-danger">🗑</button>
                                    </form>
                                </div>
                            </div>

                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center mt-4">No recipes found. Try adding one!</p>
        {% endif %}

    </div>
</div>

<!-- Bootstrap JS (optional, for components that need JS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
