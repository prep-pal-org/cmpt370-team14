<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe List</title>
</head>
<body>
    <h1>🍲 Recipe List</h1>

    <a href="{{ url_for('add_recipe') }}">➕ Add New Recipe</a>
    <br><br>

    {% if recipes %}
        <table border="1" cellpadding="10">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Ingredients</th>
                <th>Instructions</th>
                <th>Delete</th>
            </tr>
            {% for r in recipes %}
            <tr>
                <td>{{ r.recipe_id }}</td>
                <td>{{ r.name }}</td>
                <td>{{ r.ingredients }}</td>
                <td>{{ r.instructions }}</td>
                <td>
                    <form action="{{ url_for('delete_recipe', recipe_id=r.recipe_id) }}" method="post">
                        <button type="submit">🗑️ Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No recipes found. Try adding one!</p>
    {% endif %}
</body>
</html>
