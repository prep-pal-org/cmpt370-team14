<!-- Recipe List Page - Baraa -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Recipes</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    {% include 'Partial/topnav.html' %}

    <div class="recipe-background">
        <div class="container" style="padding-top:120px; padding-bottom:40px;">

            <h1 class="text-center mb-4">🍽 All Recipes</h1>

            <!-- Filters + search -->
            <form class="row g-2 mb-4" action="{{ url_for('all_recipes') }}" method="GET">

                <div class="col-md-5">
                    <input type="text" name="search_query" class="form-control"
                           placeholder="Search by name or ingredient..."
                           value="{{ search_query }}">
                </div>

                <div class="col-md-2">
                    <select name="sort" class="form-select">
                        <option value="newest" {% if current_sort == 'newest' %}selected{% endif %}>Newest</option>
                        <option value="az" {% if current_sort == 'az' %}selected{% endif %}>A - Z</option>
                        <option value="za" {% if current_sort == 'za' %}selected{% endif %}>Z - A</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select name="diet" class="form-select">
                        <option value="">All Diets</option>
                        <option value="gluten_free" {% if current_diet == 'gluten_free' %}selected{% endif %}>Gluten Free</option>
                        <option value="lactose_free" {% if current_diet == 'lactose_free' %}selected{% endif %}>Lactose Free</option>
                    </select>
                </div>

                <div class="col-md-2 d-grid">
                    <button class="btn btn-primary" type="submit">Filter</button>
                </div>

            </form>

            <!-- Card grid -->
            {% if recipes %}
                <div class="container-fluid px-2 px-md-5">
                    <div class="row g-4">
                        {% for recipe in recipes %}
                            {% set current_user = session['user_id'] %}
                            {% include 'Partial/recipe_card.html' %}
                        {% endfor %}
                    </div>
                </div>
            {% else %}
                <p class="text-center mt-4 fw-bold">No recipes found.</p>
            {% endif %}

        </div>
    </div>

    <script src="{{ url_for('static', filename='eventHandling.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
