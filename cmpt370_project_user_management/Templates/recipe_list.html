<!-- Recipe List Page - Baraa -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe List</title>

    <!-- Baraa global styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">

    <!-- Their inline styling (keep this) -->
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .recipe-search { margin-bottom: 20px; }
        .recipe-search input[type="text"] { padding: 8px; width: 300px; }
        .recipe-search button { padding: 8px 12px; }
        .recipe-list { list-style: none; padding: 0; }
        .recipe-item { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .recipe-item h3 { margin-top: 0; }
        .no-recipes { color: #777; }
    </style>
</head>

<body>

<div class="recipe-background">

<h1>🍲 Recipe List</h1>

<!-- Their search bar -->
<div class="recipe-search">
    <form action="{{ url_for('recipe_list') }}" method="GET">
        <input type="text" name="search_query" placeholder="Search by name or ingredient..." value="{{ search_query }}">
        <button type="submit">Search</button>
    </form>
</div>

<!-- Your recipe table -->
{% if recipes %}
<table class="recipe-table">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Ingredients</th>
        <th>Instructions</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>

    {% for r in recipes %}
    <tr>
        <td>{{ r.recipe_id }}</td>
        <td>{{ r.name }}</td>
        <td>{{ r.ingredients }}</td>
        <td>{{ r.instructions }}</td>

        <td>
            <a class="btn-link" href="{{ url_for('edit_recipe', recipe_id=r.recipe_id) }}">✏️ Edit</a>
        </td>

        <td>
            <form action="{{ url_for('delete_recipe', recipe_id=r.recipe_id) }}" method="post">
                <button type="submit">🗑️</button>
            </form>
        </td>
    </tr>
    {% endfor %}

</table>

{% else %}
<p style="text-align:center;">No recipes found. Try adding one!</p>
{% endif %}

</div>

</body>
</html>
