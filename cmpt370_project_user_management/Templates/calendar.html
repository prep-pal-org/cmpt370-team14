<!--Calendar template - Jordan -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meal Planning App</title>


    <!-- Bootstrap style import. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css' rel='stylesheet'>
     <!--FullCalendar core and month view import css -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <!--Calendar CSS Style  -->
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar_style.css') }}">
    <!--Website CSS Style  -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styleDesign.css') }}">
</head>
<body>
    {% include 'Partial/topnav.html' %}

    <div class="container-fluid">
        <!-- Page Title -->
        <div class="row mb-3">

        </div>

        <div class="row">
            <!-- LEFT: Options (small area) -->
            <div class="col-3">
                <div class="p-3 border rounded bg-light">
                    <div class="col-12 text-center">
                        <h4 class="fw-bold fs-2">{{ meal_plan_name }}</h4>
                    </div>
                    {% if username == creator_name %}
                        <p>You created this plan!</p>
                        <div class="mt-auto pt-2 d-flex align-items-center">
                            <p>The invite code is: </p>
                            <p class="fw-bold ms-2"> {{ code }} </p>
                        </div>
                        <form action="{{ url_for('delete_meal_plan', meal_plan_id=meal_plan_id) }}" method="POST">
                            <button type="submit" class="btn btn-small btn-danger" >Delete</button>
                        </form>
                    {% else %}
                        <p>Created by {{ creator_name }}</p>
                    {% endif %}
                    <div class="col">
                        <div class="mt-auto pt-2 d-flex align-items-center">
                            <form action="{{ url_for('list_meal_plans')}}">
                                <button class="plan_btn">View Plans</button>
                            </form>
                            <form action="{{ url_for('my_recipes')}}">
                                <button class="plan_btn">My Recipes</button>
                            </form>
                        </div>
                        <div class="mt-auto pt-2 d-flex align-items-center">
                            <form action="{{ url_for('favorite_recipes')}}">
                                <button class="plan_btn">Favorite Recipes</button>
                            </form>
                            <form action="{{ url_for('all_recipes')}}">
                                <button class="plan_btn">All Recipes</button>
                            </form>
                        </div>
                        <div class="mt-auto pt-2 d-flex align-items-center">
                            <form action="{{ 'grocery_list' }}">
                                <button class="plan_btn">Grocery List</button>
                            </form>
                            <form action="{{ url_for('add_recipe')}}">
                                <button class="plan_btn">Add Recipe</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Calendar (large area) -->
            <div class="col-9">
                <div id="calendar"
                    data-recipe-id="{{ recipe_id }}"></div>
                <!-- Calendar Modals -->
                {% include 'Partial/calendar_modal.html' %}
            </div>
        </div>
    </div>

    <!-- Script sources, for Full Calendar and document event handling -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="{{ url_for('static', filename='eventHandling.js') }}"></script>
</body>
</html>
