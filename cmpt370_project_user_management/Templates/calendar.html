<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meal Planning App</title>
    <!--CSS Style  -->
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar_style.css') }}">
    <!--FullCalendar core and month view import  -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

</head>
<body>

    <main>
        <div class="topnav">
        <a href="/login_page" id="login">Login</a>
        <a href="/user_list_for_testing" id="see_users">About Us</a>
        <a href="/login_landing_page">Home</a>
        </div>
        <br>
        <div id="calendar"></div>

        <!-- Add Event Modal-->
        <div id="addModal" class="modal hidden">
            <div class="modal-content">
                <h3>Add to Calendar</h3>
                <form id="addForm">
                    <label>Date:
                        <input type="date" id="addDate" readonly>
                    </label>
                    <br>

                    <label>Time Slot:
                        <select id="addTimeSlot">
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Snack">Snack</option>
                        </select>
                    </label>
                    <br>

                    <label>Select Recipe:
                        <select id="recipeSelect" required>
                            <!-- Options in eventHandling.js -->
                        </select>

                    </label>
                    <br>

                    <button type="submit">Submit</button>
                    <button type="button" id="addCancel">Cancel</button>

                </form>
            </div>
        </div>

        <!-- View/Delete Modal -->
        <div id="viewModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="viewTitle"></h3>
                <p>Date: <span id="viewDate"></span></p>
                <p>Time: <span id="viewTime"></span></p>
                <p>Recipe ID: <span id="viewRecipe"></span></p>
                <br>
                <button type="button" id="editBtn">Edit</button>
                <br>
                <button type="button" id="deleteBtn">Delete</button>
                <br>
                <button type="button" id="viewClose">Close</button>
            </div>
        </div>

        <div id="editModal" class="modal hidden">
            <div class="modal-content">
                <h3>Edit Event:</h3>
                <form id="editForm">
                    <label>Date:
                        <input type="date" id="editDate" required></label>
                    <br>
                    <label>Time Slot:
                        <select id="editTimeSlot" required>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Snack">Snack</option>
                        </select>
                    </label>
                    <br>
                    <button type="submit">Save</button>
                    <button type="button" id="editCancel">Cancel</button>
                </form>
            </div>
        </div>

        <!-- Error Modal -->
        <div id="alertModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="alert_title">Error</h3>
                <p id="alert_message"></p>
                <button type="button" id="alert_close">Close</button>
            </div>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="{{ url_for('static', filename='eventHandling.js') }}"></script>

</body>
</html>
