<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery List</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styleDesign.css') }}">
    <style>
        .grocery-items li {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-form {
            display: inline;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="/logout" id="logout">Logout</a>
        <a href="/about_us" id="about_us">About Us</a>
        <a href="/login_landing_page" id="home">Home</a>
        <a href="{{ url_for('grocery_list') }}">Grocery List</a>
    </div>
    <div class="center-column">
        <h1>My Grocery List</h1>

        <form action="{{ url_for('add_grocery_item') }}" method="POST">
            <label for="item_text">New Item:</label>
            <input type="text" id="item_text" name="item_text" required>

            <label for="quantity">Quantity:</label>
            <input type="text" id="quantity" name="quantity" style="width: 50px;">

            <button type="submit">Add Item</button>
        </form>

        <div class="grocery-items">
            <h2>Items:</h2>
            <ul>
                {% for item in items %}
                    <li>
                        <span>
                            {% if item.quantity %}
                                {{ item.quantity }} -
                            {% endif %}
                            {{ item.item_text }}
                        </span>

                        <form action="{{ url_for('remove_grocery_item') }}" method="POST" class="remove-form">
                            <input type="hidden" name="item_id" value="{{ item.id }}">
                            <button type="submit">Remove</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        </div>

        <a href="{{ url_for('home') }}" style="margin-top: 20px;">
            <button>Back to Home</button>
        </a>
    </div>
</body>
</html>
