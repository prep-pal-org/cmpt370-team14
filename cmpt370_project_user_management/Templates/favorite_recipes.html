<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Favorite Recipes</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{{ url_for('static', filename='home_page_image.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>

{% include 'Partial/topnav.html' %}

<div class="recipe-background" style="padding-top:80px;">
    <h1 class="text-center mb-4">Favorite Recipes</h1>

    {% if recipes %}
        <div class="container-fluid px-2 px-md-5">
            <div class="row g-4">
                {% for recipe in recipes %}
                    {% include 'Partial/recipe_card.html' %}
                {% endfor %}
            </div>
        </div>
    {% else %}
        <p class="text-center fw-bold">You have no favorite recipes yet! Click 💖 to add some.</p>
    {% endif %}

</div>

<script src="{{ url_for('static', filename='eventHandling.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
