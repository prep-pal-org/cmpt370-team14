<!-- My Recipes Page - Baraa -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{{ url_for('static', filename='home_page_image.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div class="topnav">
    <a href="/">Home</a>
    <a href="{{ url_for('grocery_list') }}">Grocery List</a>
    <a href="/recipes">All Recipes</a>
    <a href="/my_recipes">My Recipes</a>
</div>

<div class="recipe-background" style="padding-top:80px;">
    <h1 style="text-align:center; margin-bottom:30px;">My Favorite Recipes</h1>

    {% if recipes %}
        <div class="container-fluid px-2 px-md-5">
            <div class="row g-4">
                {% for recipe in recipes %}
                    {% set current_user=userName %}
                    {% include 'Partial/recipe_card.html' %}
                {% endfor %}
            </div>
        </div>
    {% else %}
        <p style="text-align:center;">You have not created any recipes yet.</p>
    {% endif %}
</div>

</body>
</html>
