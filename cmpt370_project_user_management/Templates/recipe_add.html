<!-- Add Recipe Page - Baraa -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">

    <style>
        /* backgroud */
        body {
            background-image: url("{{ url_for('static', filename='home_page_image.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <!-- nav bar -->
    {% include 'Partial/topnav.html' %}

    <div class="recipe-background">
        <div class="recipe-box">

            <h1>➕ Add Recipe</h1>

            <form method="POST" enctype="multipart/form-data">

                <label>Name:</label>
                <input class="recipe-input" type="text" name="name" required>

                <label>Ingredients:</label>
                <textarea class="recipe-textarea" name="ingredients" required></textarea>

                <label>Instructions:</label>
                <textarea class="recipe-textarea" name="instructions" required></textarea>

                <label>Upload Image(s):</label>

                <!-- Button + Drag-drop -->
                <div style="display:flex; gap:10px; align-items:center;">

                    <button type="button" id="open-file-picker" class="small-btn">
                        📎 Select Image(s)
                    </button>

                    <div id="drop-zone" class="image-drop-zone" style="flex-grow:1;">
                        <p>Drag & drop recipe images here</p>
                    </div>

                </div>

                <!-- Hidden file input -->
                <input id="recipe-images" type="file" name="recipe_images"
                       accept="image/*" multiple style="display:none;">

                <br><br>
                <button type="submit">Add Recipe</button>
            </form>

            <br>
            <a class="btn-link" href="{{ url_for('recipe_list') }}">⬅ Back to Recipes</a>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('recipe-images');
        const openButton = document.getElementById('open-file-picker');

        if (openButton) {
            openButton.addEventListener('click', () => fileInput.click());
        }

        if (dropZone && fileInput) {
            dropZone.addEventListener('click', () => fileInput.click());

            ['dragenter', 'dragover'].forEach(evt => {
                dropZone.addEventListener(evt, e => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                });
            });

            ['dragleave', 'drop'].forEach(evt => {
                dropZone.addEventListener(evt, e => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                });
            });

            dropZone.addEventListener('drop', e => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    dropZone.querySelector('p').textContent =
                        files.length + " file(s) selected";
                }
            });
        }
    </script>

    <!-- Handle Flash Messages. -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div id="popup" class="popup">
                <div class="popup-content">
                    <p>{{ messages[0] }}</p>
                    <button onclick="closePopup()">Close</button>
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='eventHandling.js') }}"></script>

</body>
</html>
