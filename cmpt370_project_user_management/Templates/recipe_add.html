<!-- Add Recipe Page - Baraa -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Recipe</title>
</head>

<body>

<h1>➕ Add New Recipe</h1>

<!-- Form used to create a new recipe -->
<form method="POST">

    <!-- Recipe Name -->
    <label for="name">Name:</label><br>
    <input type="text" name="name" required><br><br>

    <!-- Recipe Ingredients -->
    <label for="ingredients">Ingredients:</label><br>
    <textarea name="ingredients" rows="4" cols="40" required></textarea><br><br>

    <!-- Recipe Instructions -->
    <label for="instructions">Instructions:</label><br>
    <textarea name="instructions" rows="4" cols="40" required></textarea><br><br>

    <!-- Submit new recipe -->
    <button type="submit">Add Recipe</button>

</form>

<br>

<!-- Link back to recipe list -->
<a href="{{ url_for('recipe_list') }}">⬅ Back to Recipes</a>
