<!-- My Recipes Page - Baraa -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">

    <!-- Bootstrap for card layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="topnav">
    <a href="/">Home</a>
    <a href="/recipes">All Recipes</a>
    <a href="/my_recipes">My Recipes</a>
</div>

<div class="recipe-background" style="padding-top:80px;">
    <h1 style="text-align:center; margin-bottom:30px;">My Recipes</h1>

    {% if recipes %}
        <div class="container">
            <div class="row g-4">
                {% for r in recipes %}
                    <div class="col-sm-6 col-md-4 col-lg-3">

                        <div class="card h-100">

                            {% if r.image_path %}
                                <img src="{{ url_for('static', filename=r.image_path) }}"
                                     class="card-img-top" style="height:180px; object-fit:cover;">
                            {% endif %}

                            <div class="card-body">
                                <h5 class="card-title">{{ r.name }}</h5>
                                <a href="{{ url_for('edit_recipe', recipe_id=r.recipe_id) }}"
                                   class="btn btn-primary btn-sm">Edit Recipe</a>
                            </div>

                        </div>

                    </div>
                {% endfor %}
            </div>
        </div>
    {% else %}
        <p style="text-align:center;">You have not created any recipes yet.</p>
    {% endif %}

</div>

</body>
</html>
