<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Recipes</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styleDesign.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{{ url_for('static', filename='home_page_image.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>

{% include 'Partial/topnav.html' %}

<div class="recipe-background" style="padding-top:80px;">
    <h1 class="text-center mb-4">My Recipes</h1>

    {% if recipes %}
        <div class="container">
            <div class="row g-4">
                {% for recipe in recipes %}
                    <div class="col-sm-6 col-md-4 col-lg-3">

                        <div class="card h-100">

                            {% if recipe.first_image %}
                                <img src="{{ url_for('static', filename=recipe.first_image) }}"
                                     class="card-img-top"
                                     style="height:180px; object-fit:cover;">
                            {% endif %}

                            <div class="card-body">
                                <h5 class="card-title">{{ recipe.name }}</h5>

                                <a href="{{ url_for('edit_recipe', recipe_id=recipe.recipe_id) }}"
                                   class="btn btn-primary btn-sm">Edit</a>

                                <a href="{{ url_for('view_recipe', recipe_id=recipe.recipe_id) }}"
                                   class="btn btn-secondary btn-sm">View</a>
                            </div>

                        </div>

                    </div>
                {% endfor %}
            </div>
        </div>
    {% else %}
        <p class="text-center">You have not created any recipes yet.</p>
    {% endif %}

</div>

<script src="{{ url_for('static', filename='eventHandling.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
